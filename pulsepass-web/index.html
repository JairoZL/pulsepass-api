<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PulsePass: eventos, artistas y entradas." />
    <title>PulsePass</title>
    <script>
      // Modo oscuro (FR-FE-GEN-004): se aplica antes de pintar para evitar un destello claro.
      // Preferencia guardada por la persona o, si no hay, la del sistema operativo.
      ;(function () {
        try {
          var guardado = localStorage.getItem('pulsepass.tema')
          var oscuro = guardado ? guardado === 'oscuro' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (oscuro) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
